name: "🔧 Apply V145 (A oder 1)"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  v145:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "✍️ Patch-Skript schreiben"
        run: |
          echo "" | base64 -d > /tmp/patch_v145.py
          echo "" | base64 -d > /tmp/pr_body.md

      - name: "🩹 Patch anwenden"
        run: python3 /tmp/patch_v145.py | tee /tmp/patch_log.txt

      - name: "🟢 Node 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "🧪 Build-Verifikation (Gate vor Commit)"
        run: |
          npm install
          npm run build

      - name: "🌿 Branch, Commit & Pull Request"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B feat/v145-a-oder-1
          git add -A
          git commit -m "V145: A-oder-1-Lesart wieder in der Kurzansicht (zwei Marken, eine Zeile); Chart-Label A/1 bei impulsivem erstem Korrekturbein"
          git push -u origin feat/v145-a-oder-1 --force
          gh pr create --base main --head feat/v145-a-oder-1 \
            --title "V145: A oder 1 sichtbar" \
            --body-file /tmp/pr_body.md \
            || echo "::warning::PR manuell: https://github.com/$GITHUB_REPOSITORY/compare/main...feat/v145-a-oder-1"
          {
            echo "### ✅ V145 gebaut & gepusht"
            echo ""
            echo '```'
            cat /tmp/patch_log.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
