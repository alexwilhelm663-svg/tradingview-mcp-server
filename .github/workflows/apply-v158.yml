name: "🔧 Apply V158 (Screener-Tabelle)"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  v158:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "✍️ Dateien schreiben"
        run: |
          write() { mkdir -p "$(dirname "$1")"; echo "$2" | base64 -d > "$1"; echo "✓ $1"; }
          write "src/core/screener.ts" ""
          write "src/index.ts" ""
          write "package.json" ""
          write "/tmp/pr_body.md" ""

      - name: "🟢 Node 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "🧪 Build + Referenzprüfung (Gate vor Commit)"
        run: |
          npm install
          npm run build
          npm run verify

      - name: "🌿 Branch, Commit & Pull Request"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B feat/v158-screener-tabelle
          git add -A
          git commit -m "V158: Screener als Monospace-Tabelle - 40 Zeichen breit, Quelle und Reife als je ein Zeichen, zweite Zone als Spalte"
          git push -u origin feat/v158-screener-tabelle --force
          gh pr create --base main --head feat/v158-screener-tabelle \
            --title "V158: Screener-Tabelle" \
            --body-file /tmp/pr_body.md \
            || echo "::warning::PR manuell: https://github.com/$GITHUB_REPOSITORY/compare/main...feat/v158-screener-tabelle"
          {
            echo "### ✅ V158 gebaut, geprueft & gepusht"
          } >> "$GITHUB_STEP_SUMMARY"
