name: "🔧 Apply V161 (Setup-Chart)"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  v161:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "✍️ Dateien schreiben"
        run: |
          write() { mkdir -p "$(dirname "$1")"; echo "$2" | base64 -d > "$1"; echo "✓ $1"; }
          write "src/core/setupChart.ts" ""
          write "src/core/engine.ts" ""
          write "src/bot/commands.ts" ""
          write "src/index.ts" ""
          write "package.json" ""
          write "/tmp/pr_body.md" ""

      - name: "🟢 Node 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "🧪 Build + Referenzprüfung (Gate vor Commit)"
        run: |
          npm install
          npm run build
          npm run verify

      - name: "🌿 Branch, Commit & Pull Request"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B feat/v161-setup-chart
          git add -A
          git commit -m "V161: /setup - eigener 30-Minuten-Chart fuer die 1-2-Struktur; Hauptchart auf drei Ebenen entlastet; Zyklen-Sicht nur noch bei Enthaltung (sie segmentiert unabhaengig von den Wellenpunkten)"
          git push -u origin feat/v161-setup-chart --force
          gh pr create --base main --head feat/v161-setup-chart \
            --title "V161: Setup-Chart, Hauptchart entlastet" \
            --body-file /tmp/pr_body.md \
            || echo "::warning::PR manuell: https://github.com/$GITHUB_REPOSITORY/compare/main...feat/v161-setup-chart"
          {
            echo "### ✅ V161 gebaut, geprueft & gepusht"
          } >> "$GITHUB_STEP_SUMMARY"
