name: "🔧 Apply V154 (Kontinuität)"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  v154:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "✍️ Dateien schreiben"
        run: |
          write() { mkdir -p "$(dirname "$1")"; echo "$2" | base64 -d > "$1"; echo "✓ $1"; }
          write "src/core/continuity.ts" ""
          write "src/core/degree.ts" ""
          write "src/core/impulseFinder.ts" ""
          write "src/core/engine.ts" ""
          write "src/core/cycles.ts" ""
          write "src/core/chart.ts" ""
          write "src/core/proportion.ts" ""
          write "src/verify.ts" ""
          write "knowledge/reference/counts.json" ""
          write "python_service/drawer.py" ""
          write "knowledge/rules/elliott_rules.md" ""
          write "src/index.ts" ""
          write "package.json" ""
          write "/tmp/pr_body.md" ""

      - name: "🟢 Node 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "🧪 Build + Referenzprüfung (Gate vor Commit)"
        run: |
          npm install
          npm run build
          python3 -m py_compile python_service/drawer.py
          npm run verify

      - name: "🌿 Branch, Commit & Pull Request"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B feat/v154-kontinuitaet
          git add -A
          git commit -m "V154: Kontinuitaet der Zaehlung messen und ausweisen (uebersprungene Pivots, ungezaehlte Vorgeschichte) plus Stichentscheid zugunsten durchgehender Zaehlungen; enthaelt V147-V153"
          git push -u origin feat/v154-kontinuitaet --force
          gh pr create --base main --head feat/v154-kontinuitaet \
            --title "V154: Kontinuitaet der Zaehlung (+ V147-V153)" \
            --body-file /tmp/pr_body.md \
            || echo "::warning::PR manuell: https://github.com/$GITHUB_REPOSITORY/compare/main...feat/v154-kontinuitaet"
          {
            echo "### ✅ V154 gebaut, geprueft & gepusht"
          } >> "$GITHUB_STEP_SUMMARY"
