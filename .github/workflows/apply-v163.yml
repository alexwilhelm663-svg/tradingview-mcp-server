name: "🔧 Apply V163 (W1-Schwelle 10%)"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  v163:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "✍️ Dateien schreiben"
        run: |
          write() { mkdir -p "$(dirname "$1")"; echo "$2" | base64 -d > "$1"; echo "✓ $1"; }
          write "src/core/proportion.ts" ""
          write "src/snapshot.ts" ""
          write "knowledge/reference/counts.json" ""
          write "knowledge/reference/snapshots.json" ""
          write "src/index.ts" ""
          write "package.json" ""
          write "/tmp/pr_body.md" ""

      - name: "🟢 Node 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "🧪 Build + Referenzen + Struktur-Snapshots"
        run: |
          npm install
          npm run build
          npm run verify
          npm run snapshot

      - name: "🌿 Branch, Commit & Pull Request"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B fix/v163-w1-schwelle
          git add -A
          git commit -m "V163: MIN_W1_SHARE von 0.15 auf 0.10 - ALAB zaehlt wieder (12.3 Prozent W1-Anteil), ARM bleibt durch die Zeitregel draussen; Baselines aktualisiert"
          git push -u origin fix/v163-w1-schwelle --force
          gh pr create --base main --head fix/v163-w1-schwelle \
            --title "V163: W1-Schwelle 10 Prozent" \
            --body-file /tmp/pr_body.md \
            || echo "::warning::PR manuell: https://github.com/$GITHUB_REPOSITORY/compare/main...fix/v163-w1-schwelle"
          {
            echo "### ✅ V163 gebaut, geprueft & gepusht"
          } >> "$GITHUB_STEP_SUMMARY"
