name: "🔧 Apply V159 (1-2 einzeichnen)"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  v159:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "✍️ Dateien schreiben"
        run: |
          write() { mkdir -p "$(dirname "$1")"; echo "$2" | base64 -d > "$1"; echo "✓ $1"; }
          write "src/core/multiWave.ts" ""
          write "src/core/chart.ts" ""
          write "src/core/engine.ts" ""
          write "python_service/drawer.py" ""
          write "src/index.ts" ""
          write "package.json" ""
          write "/tmp/pr_body.md" ""

      - name: "🟢 Node 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "🧪 Build + Referenzprüfung (Gate vor Commit)"
        run: |
          npm install
          npm run build
          python3 -m py_compile python_service/drawer.py
          npm run verify

      - name: "🌿 Branch, Commit & Pull Request"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B feat/v159-multiwave-chart
          git add -A
          git commit -m "V159: 1-2-Staffelung als Wellenpunkte im Chart (gruener Linienzug mit 1/2-Labels) statt nur als Textnotiz"
          git push -u origin feat/v159-multiwave-chart --force
          gh pr create --base main --head feat/v159-multiwave-chart \
            --title "V159: 1-2-Staffelung einzeichnen" \
            --body-file /tmp/pr_body.md \
            || echo "::warning::PR manuell: https://github.com/$GITHUB_REPOSITORY/compare/main...feat/v159-multiwave-chart"
          {
            echo "### ✅ V159 gebaut, geprueft & gepusht"
          } >> "$GITHUB_STEP_SUMMARY"
