name: "🔧 Apply V162 (Report-CLI + Snapshots)"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  v162:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "✍️ Dateien schreiben"
        run: |
          write() { mkdir -p "$(dirname "$1")"; echo "$2" | base64 -d > "$1"; echo "✓ $1"; }
          write "src/core/reportText.ts" ""
          write "src/report.ts" ""
          write "src/snapshot.ts" ""
          write "knowledge/reference/snapshots.json" ""
          write "src/bot/commands.ts" ""
          write "src/index.ts" ""
          write "package.json" ""
          write "/tmp/pr_body.md" ""

      - name: "🟢 Node 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "🧪 Build + Referenzen + Struktur-Snapshots"
        run: |
          npm install
          npm run build
          npm run verify
          npm run snapshot

      - name: "🌿 Branch, Commit & Pull Request"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B feat/v162-report-snapshots
          git add -A
          git commit -m "V162: npm run report (Volltext-Report als CLI) und npm run snapshot (struktureller Fingerabdruck je Referenztitel); commands.ts nutzt die gemeinsame Textquelle"
          git push -u origin feat/v162-report-snapshots --force
          gh pr create --base main --head feat/v162-report-snapshots \
            --title "V162: Report-CLI + Struktur-Snapshots" \
            --body-file /tmp/pr_body.md \
            || echo "::warning::PR manuell: https://github.com/$GITHUB_REPOSITORY/compare/main...feat/v162-report-snapshots"
          {
            echo "### ✅ V162 gebaut, geprueft & gepusht"
          } >> "$GITHUB_STEP_SUMMARY"
