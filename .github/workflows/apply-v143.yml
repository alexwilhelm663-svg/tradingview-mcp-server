name: "🔧 Apply V143 (Kritiker-Feedback-Loop)"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  v143:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "✍️ Patch-Skript schreiben"
        run: |
          echo "" | base64 -d > /tmp/patch_v143.py
          echo "" | base64 -d > /tmp/pr_body.md

      - name: "🩹 Patch anwenden"
        run: python3 /tmp/patch_v143.py | tee /tmp/patch_log.txt

      - name: "🟢 Node 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "🧪 Build-Verifikation (Gate vor Commit)"
        run: |
          npm install
          npm run build

      - name: "🌿 Branch, Commit & Pull Request"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B feat/v143-feedback-loop
          git add -A
          git commit -m "V143: Kritiker als Feedback-Loop - Score-Schwelle wird aus der realisierten Trefferbilanz je Confidence-Band und Flag kalibriert; LLM bleibt aus dem kritischen Pfad"
          git push -u origin feat/v143-feedback-loop --force
          gh pr create --base main --head feat/v143-feedback-loop \
            --title "V143: Kritiker-Feedback-Loop" \
            --body-file /tmp/pr_body.md \
            || echo "::warning::PR manuell: https://github.com/$GITHUB_REPOSITORY/compare/main...feat/v143-feedback-loop"
          {
            echo "### ✅ V143 gebaut & gepusht"
            echo ""
            echo '```'
            cat /tmp/patch_log.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
