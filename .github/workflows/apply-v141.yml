name: "🔧 Apply V141 (Kurzmodus)"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  v141:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "✍️ Patch-Skript schreiben"
        run: |
          echo "" | base64 -d > /tmp/patch_v141.py
          echo "" | base64 -d > /tmp/pr_body.md

      - name: "🩹 Patch anwenden"
        run: python3 /tmp/patch_v141.py | tee /tmp/patch_log.txt

      - name: "🟢 Node 20"
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: "🧪 Build-Verifikation (Gate vor Commit)"
        run: |
          npm install
          npm run build

      - name: "🌿 Branch, Commit & Pull Request"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B feat/v141-kurzmodus
          git add -A
          git commit -m "V141: Kurzmodus als Standard - Struktur-, Umschlag-, Rahmen- und Detailausgaben nur noch mit Schluesselwort detail"
          git push -u origin feat/v141-kurzmodus --force
          gh pr create --base main --head feat/v141-kurzmodus \
            --title "V141: Kurzmodus als Standard" \
            --body-file /tmp/pr_body.md \
            || echo "::warning::PR manuell: https://github.com/$GITHUB_REPOSITORY/compare/main...feat/v141-kurzmodus"
          {
            echo "### ✅ V141 gebaut & gepusht"
            echo ""
            echo '```'
            cat /tmp/patch_log.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
