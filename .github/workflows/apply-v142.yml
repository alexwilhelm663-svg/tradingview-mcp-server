name: "🔧 Apply V142 (C nachziehen)"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  v142:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "✍️ Patch-Skript schreiben"
        run: |
          echo "" | base64 -d > /tmp/patch_v142.py
          echo "" | base64 -d > /tmp/pr_body.md

      - name: "🩹 Patch anwenden"
        run: python3 /tmp/patch_v142.py | tee /tmp/patch_log.txt

      - name: "🟢 Node 20"
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: "🧪 Build-Verifikation (Gate vor Commit)"
        run: |
          npm install
          npm run build

      - name: "🌿 Branch, Commit & Pull Request"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B fix/v142-c-nachziehen
          git add -A
          git commit -m "V142: C-Marke auf laufendes Extrem nachziehen, wenn die Korrektur weit ueber die erste A-B-C-Sequenz hinauslaeuft; 1-2-Strukturzeilen wieder in der Kurzansicht"
          git push -u origin fix/v142-c-nachziehen --force
          gh pr create --base main --head fix/v142-c-nachziehen \
            --title "V142: C nachziehen, Struktur sichtbar" \
            --body-file /tmp/pr_body.md \
            || echo "::warning::PR manuell: https://github.com/$GITHUB_REPOSITORY/compare/main...fix/v142-c-nachziehen"
          {
            echo "### ✅ V142 gebaut & gepusht"
            echo ""
            echo '```'
            cat /tmp/patch_log.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
