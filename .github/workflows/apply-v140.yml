name: "🔧 Apply V140 (Report kürzen)"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  v140:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "✍️ Patch-Skript schreiben"
        run: |
          echo "" | base64 -d > /tmp/patch_v140.py
          echo "" | base64 -d > /tmp/pr_body.md

      - name: "🩹 Patch anwenden"
        run: python3 /tmp/patch_v140.py

      - name: "🟢 Node 20"
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: "🧪 Build-Verifikation (Gate vor Commit)"
        run: |
          npm install
          npm run build

      - name: "🌿 Branch, Commit & Pull Request"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B feat/v140-report-kuerzen
          git add -A
          git commit -m "V140: Report auf Zahlen und Marken gekuerzt - Erklaertexte in Struktur-, Umschlag- und Rahmenhinweisen entfernt (keine Logikaenderung)"
          git push -u origin feat/v140-report-kuerzen --force
          gh pr create --base main --head feat/v140-report-kuerzen \
            --title "V140: Report auf Marken gekuerzt" \
            --body-file /tmp/pr_body.md \
            || echo "::warning::PR manuell: https://github.com/$GITHUB_REPOSITORY/compare/main...feat/v140-report-kuerzen"
          {
            echo "### ✅ V140 gebaut & gepusht"
          } >> "$GITHUB_STEP_SUMMARY"
