name: "🔧 Apply V164 (kurze Historie)"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  v164:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "✍️ Dateien schreiben"
        run: |
          write() { mkdir -p "$(dirname "$1")"; echo "$2" | base64 -d > "$1"; echo "✓ $1"; }
          write "src/core/marketData.ts" ""
          write "src/core/engine.ts" ""
          write "knowledge/reference/counts.json" ""
          write "knowledge/reference/snapshots.json" ""
          write "src/index.ts" ""
          write "package.json" ""
          write "/tmp/pr_body.md" ""

      - name: "🟢 Node 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "🧪 Build + Referenzen + Struktur-Snapshots"
        run: |
          npm install
          npm run build
          npm run verify
          npm run snapshot

      - name: "🌿 Branch, Commit & Pull Request"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B feat/v164-kurze-historie
          git add -A
          git commit -m "V164: strukturierter Fehler bei zu kurzer Historie (mit Erstnotiz) und Auto-Fallback auf feinere Aufloesung - frische Listings wie SPCX werden analysierbar"
          git push -u origin feat/v164-kurze-historie --force
          gh pr create --base main --head feat/v164-kurze-historie \
            --title "V164: Auto-Fallback bei kurzer Historie" \
            --body-file /tmp/pr_body.md \
            || echo "::warning::PR manuell: https://github.com/$GITHUB_REPOSITORY/compare/main...feat/v164-kurze-historie"
          {
            echo "### ✅ V164 gebaut, geprueft & gepusht"
          } >> "$GITHUB_STEP_SUMMARY"
