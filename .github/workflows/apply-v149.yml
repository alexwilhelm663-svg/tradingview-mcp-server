name: "🔧 Apply V149 (Binnenstruktur)"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  v149:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "✍️ Dateien schreiben"
        run: |
          write() { mkdir -p "$(dirname "$1")"; echo "$2" | base64 -d > "$1"; echo "✓ $1"; }
          write "src/core/cycles.ts" ""
          write "src/core/engine.ts" ""
          write "src/core/impulseFinder.ts" ""
          write "src/core/proportion.ts" ""
          write "knowledge/rules/elliott_rules.md" ""
          write "src/index.ts" ""
          write "package.json" ""
          write "/tmp/pr_body.md" ""

      - name: "🟢 Node 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "🧪 Build-Verifikation (Gate vor Commit)"
        run: |
          npm install
          npm run build

      - name: "🌿 Branch, Commit & Pull Request"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B feat/v149-binnenstruktur
          git add -A
          git commit -m "V149: Binnenstruktur der laufenden Phase (3/5/7-9-11-teilig, Lage-Diskriminante je Phasentyp); enthaelt V147 (Proportionalitaet kalibriert + Walk-down) und V148 (Zyklen-Sicht)"
          git push -u origin feat/v149-binnenstruktur --force
          gh pr create --base main --head feat/v149-binnenstruktur \
            --title "V149: Binnenstruktur (+ V147, V148)" \
            --body-file /tmp/pr_body.md \
            || echo "::warning::PR manuell: https://github.com/$GITHUB_REPOSITORY/compare/main...feat/v149-binnenstruktur"
          {
            echo "### ✅ V149 gebaut & gepusht"
          } >> "$GITHUB_STEP_SUMMARY"
