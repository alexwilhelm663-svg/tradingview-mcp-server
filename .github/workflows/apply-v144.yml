name: "🔧 Apply V144 (belastbare 1-2-Struktur)"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  v144:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "✍️ Patch-Skript schreiben"
        run: |
          echo "" | base64 -d > /tmp/patch_v144.py
          echo "" | base64 -d > /tmp/pr_body.md

      - name: "🩹 Patch anwenden"
        run: python3 /tmp/patch_v144.py | tee /tmp/patch_log.txt

      - name: "🟢 Node 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "🧪 Build-Verifikation (Gate vor Commit)"
        run: |
          npm install
          npm run build

      - name: "🌿 Branch, Commit & Pull Request"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B fix/v144-belastbare-struktur
          git add -A
          git commit -m "V144: 1-2-Struktur-Erkennung neu - jede Einheit einzeln belegt (Beingroesse, Dauer, Retracement, impulsive erste Welle 1); Enthaltung statt Rauschen"
          git push -u origin fix/v144-belastbare-struktur --force
          gh pr create --base main --head fix/v144-belastbare-struktur \
            --title "V144: belastbare 1-2-Strukturen" \
            --body-file /tmp/pr_body.md \
            || echo "::warning::PR manuell: https://github.com/$GITHUB_REPOSITORY/compare/main...fix/v144-belastbare-struktur"
          {
            echo "### ✅ V144 gebaut & gepusht"
            echo ""
            echo '```'
            cat /tmp/patch_log.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
