name: "🔧 Apply V160 (bestätigte Welle-2-Tiefs)"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  v160:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "✍️ Dateien schreiben"
        run: |
          write() { mkdir -p "$(dirname "$1")"; echo "$2" | base64 -d > "$1"; echo "✓ $1"; }
          write "src/core/multiWave.ts" ""
          write "src/index.ts" ""
          write "package.json" ""
          write "/tmp/pr_body.md" ""

      - name: "🟢 Node 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "🧪 Build + Referenzprüfung (Gate vor Commit)"
        run: |
          npm install
          npm run build
          npm run verify

      - name: "🌿 Branch, Commit & Pull Request"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B fix/v160-bestaetigte-tiefs
          git add -A
          git commit -m "V160: Welle-2-Tiefs muessen mindestens 5 Kerzen alt sein - unbestaetigte Einheiten am Chartrand werden nicht mehr als fertig gezaehlt (NVO 3x -> 2x, BILL 3 -> 2 Grade)"
          git push -u origin fix/v160-bestaetigte-tiefs --force
          gh pr create --base main --head fix/v160-bestaetigte-tiefs \
            --title "V160: bestaetigte Welle-2-Tiefs" \
            --body-file /tmp/pr_body.md \
            || echo "::warning::PR manuell: https://github.com/$GITHUB_REPOSITORY/compare/main...fix/v160-bestaetigte-tiefs"
          {
            echo "### ✅ V160 gebaut, geprueft & gepusht"
          } >> "$GITHUB_STEP_SUMMARY"
