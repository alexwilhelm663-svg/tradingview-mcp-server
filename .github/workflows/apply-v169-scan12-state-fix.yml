        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🌿 Fix-Branch erstellen"
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$BASE_BRANCH"
          git checkout -B fix/v169-scan12-state "origin/$BASE_BRANCH"

      - name: "🩹 V169-Patch anwenden"
