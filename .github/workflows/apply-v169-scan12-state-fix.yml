          +import assert from "node:assert/strict";
          +import type { Candle } from "./marketData";
          +import {
          +  findCloseBreach,
          +  isActionableMultiWave,
          +  preferMultiWaveCandidate,
          +  type MultiWaveRead,
          +} from "./multiWave";
          +
          +const candle = (date: string, close: number): Candle => ({
          +  date,
          +  open: close,
          +  high: close,
          +  low: close,
          +  close,
          +});
          +
          +// Ein spaeterer Schluss unter 268 invalidiert den alten Long-Count dauerhaft.
          +const longBreak = findCloseBreach(
          +  [
          +    candle("2026-08-01", 275),
          +    candle("2026-08-02", 267),
          +    candle("2026-08-03", 271),
          +  ],
          +  "2026-08-01",
          +  268,
          +  1
          +);
          +assert.deepEqual(longBreak, { date: "2026-08-02", close: 267 });
          +
          +// Die Rueckkehr ueber die Marke darf den historischen Bruch nicht loeschen.
          +assert.equal(longBreak?.date, "2026-08-02");
          +
          +const points = (date: string) => [
          +  { label: "", date: "2026-01-01", price: 100 },
          +  { label: "1", date: "2026-02-01", price: 130 },
          +  { label: "2", date, price: 115 },
          +];
          +const read = (overrides: Partial<MultiWaveRead>): MultiWaveRead => ({
          +  active: false,
          +  nested: false,
          +  legs: 2,
          +  currentInvalidation: 115,
          +  intact: true,
          +  breachDate: null,
          +  breachClose: null,
          +  note: "2× 1-2",
          +  points: points("2026-03-01"),
          +  ...overrides,
          +});
          +
          +// Ein intakter Kandidat muss immer vor einem alten gebrochenen gewinnen.
          +const staleBroken = read({
          +  nested: true,
          +  intact: false,
          +  breachDate: "2026-04-01",
          +  breachClose: 110,
          +  note: "gebrochen",
          +  points: points("2026-02-15"),
          +});
          +const currentIntact = read({ points: points("2026-03-15") });
          +assert.equal(preferMultiWaveCandidate(currentIntact, staleBroken), true);
          +assert.equal(preferMultiWaveCandidate(staleBroken, currentIntact), false);
          +assert.equal(isActionableMultiWave(currentIntact), true);
          +assert.equal(isActionableMultiWave(staleBroken), false);
          +
          +console.log("✅ Scan12-Regressionspruefung bestanden");
          PATCH

          if git apply --check "$patch_file"; then
            git apply "$patch_file"
          elif git apply --reverse --check "$patch_file"; then
            echo "V169 ist bereits angewendet."
          else
            echo "::error::V169-Patch passt nicht auf den aktuellen Stand. Erwartete Basis: V168."
            exit 1
          fi

      - name: "🟢 Node 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: "🧪 Build + deterministische Regression"
        run: |
          npm ci
          npm run build
          npm run verify:scan12

      - name: "📤 Commit und Branch pushen"
        id: publish
        env:
          BRANCH: fix/v169-scan12-state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/multiWave.ts src/core/structureScan.ts src/core/scan12Regression.ts src/index.ts package.json package-lock.json

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "V169: filter invalidated scan12 candidates"
          git push --force-with-lease --set-upstream origin "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: "🔀 Pull Request erstellen oder aktualisieren"
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH: fix/v169-scan12-state
        run: |
          existing="$(gh pr list --base "$BASE_BRANCH" --head "$BRANCH" --state open --json url --jq '.[0].url')"
          if [ -n "$existing" ]; then
            echo "PR aktualisiert: $existing"
          else
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$BRANCH" \
              --title "V169: /scan12 zeigt nur intakte 1-2-Setups" \
              --body "$(cat <<'BODY'
          ## Ursache

          V168 gab historische, bereits per Schlusskurs invalidierte Multi-1-2-Kandidaten weiterhin als Scanner-Treffer aus. Gleichzeitig wurde `nested` aus `active` abgeleitet; bei einem Bruch wurde deshalb die Verschachtelung fälschlich als `·✕` statt als ehemals verschachtelter Count dargestellt.

          ## Fix

          - `/scan12` zeigt ausschließlich aktuell intakte Setups.
          - `nested` und `active` sind getrennte Zustände.
          - Intakte und neuere Anker gewinnen gegen alte gebrochene Kandidaten.
          - Bruchdatum und Bruchschluss werden für explizite Diagnosen gespeichert.
          - Ein deterministischer ARM-268-Regressionsfall schützt das Verhalten.

          ## Verifikation

          - `npm run build`
          - `npm run verify:scan12`
          BODY
          )"
          fi

      - name: "📝 Zusammenfassung"
        run: |
          {
            echo "### ✅ V169 Scan12 Status-Fix"
            echo "- Historisch gebrochene Counts werden nicht mehr als aktuelle Setups gelistet."
            echo "- Bruchzustand und Verschachtelung sind getrennt."
            echo "- TypeScript-Build und ARM-Regression sind Pflicht-Gates."
          } >> "$GITHUB_STEP_SUMMARY"
