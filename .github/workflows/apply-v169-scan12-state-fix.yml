name: "🔧 Apply V169 (Scan12 Status-Fix)"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: apply-v169-scan12-state-fix
  cancel-in-progress: false

jobs:
