name: "🔧 Apply V147 (Proportionalität kalibriert)"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  v147:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "✍️ Dateien schreiben"
        run: |
          write() { mkdir -p "$(dirname "$1")"; echo "$2" | base64 -d > "$1"; echo "✓ $1"; }
          write "src/core/impulseFinder.ts" ""
          write "src/core/proportion.ts" ""
          write "src/core/engine.ts" ""
          write "knowledge/rules/elliott_rules.md" ""
          write "src/index.ts" ""
          write "package.json" ""
          write "/tmp/pr_body.md" ""

      - name: "🟢 Node 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "🧪 Build-Verifikation (Gate vor Commit)"
        run: |
          npm install
          npm run build

      - name: "🌿 Branch, Commit & Pull Request"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B fix/v147-proportionalitaet-kalibriert
          git add -A
          git commit -m "V147: Proportionalitaets-Filter empirisch kalibriert (W1-Anteil 15%, Zeit 25x, W3-Gegenzug 2.5x; W5-Regel gestrichen) und als Validator in den DK-8-Walk-down gehaengt - Neuzaehlung statt Enthaltung"
          git push -u origin fix/v147-proportionalitaet-kalibriert --force
          gh pr create --base main --head fix/v147-proportionalitaet-kalibriert \
            --title "V147: Proportionalitaet kalibriert + Walk-down" \
            --body-file /tmp/pr_body.md \
            || echo "::warning::PR manuell: https://github.com/$GITHUB_REPOSITORY/compare/main...fix/v147-proportionalitaet-kalibriert"
          {
            echo "### ✅ V147 gebaut & gepusht"
          } >> "$GITHUB_STEP_SUMMARY"
