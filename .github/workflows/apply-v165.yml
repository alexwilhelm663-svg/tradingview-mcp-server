name: "🔧 Apply V165 (Analyse-Tafel /deep)"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  v165:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "✍️ Dateien schreiben"
        run: |
          write() { mkdir -p "$(dirname "$1")"; echo "$2" | base64 -d > "$1"; echo "✓ $1"; }
          write "src/core/deepChart.ts" ""
          write "python_service/deep_drawer.py" ""
          write "src/bot/commands.ts" ""
          write "src/index.ts" ""
          write "package.json" ""
          write "/tmp/pr_body.md" ""

      - name: "🟢 Node 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "🧪 Build + Referenzen + Struktur-Snapshots"
        run: |
          npm install
          npm run build
          python3 -m py_compile python_service/deep_drawer.py
          npm run verify
          npm run snapshot

      - name: "🌿 Branch, Commit & Pull Request"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B feat/v165-analyse-tafel
          git add -A
          git commit -m "V165: /deep - Analyse-Tafel mit Zaehlung, Zielzonen, Entscheidungsmarken, Seitenleiste und schematischer Projektion; eigener Drawer, Standard-Chart unveraendert"
          git push -u origin feat/v165-analyse-tafel --force
          gh pr create --base main --head feat/v165-analyse-tafel \
            --title "V165: Analyse-Tafel /deep" \
            --body-file /tmp/pr_body.md \
            || echo "::warning::PR manuell: https://github.com/$GITHUB_REPOSITORY/compare/main...feat/v165-analyse-tafel"
          {
            echo "### ✅ V165 gebaut, geprueft & gepusht"
          } >> "$GITHUB_STEP_SUMMARY"
