name: "📐 Apply V171 (Deep Decision Board)"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: apply-v171-deep-decision-board
  cancel-in-progress: false

jobs:
  v171:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🌿 Fix-Branch erstellen"
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$BASE_BRANCH"
          git checkout -B fix/v171-deep-decision-board "origin/$BASE_BRANCH"

      - name: "🧭 Erwartete Basis prüfen"
        shell: bash
        run: |
          node <<'NODE'
          const pkg = require("./package.json");
          if (!["170.0.0", "171.0.0"].includes(pkg.version)) {
            console.error(`V171 erwartet V170 als Basis; gefunden: ${pkg.version}`);
            process.exit(1);
          }
          NODE

