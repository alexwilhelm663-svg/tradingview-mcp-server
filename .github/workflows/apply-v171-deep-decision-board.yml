             "keine künstlichen Kursziele"],
            [deep.includes(".filter((c) => c.score >= 2)"),
             "Score-1-Level werden nicht als Zonen visualisiert"],
            [forecast.includes("return inspectForecastSetup(candles, options)?.setup ?? null"),
             "Live-Detektor und Deep-Inspektion teilen einen Pfad"],
            [drawer.includes("SETUP-ZOOM") && drawer.includes("KEINE ZEITPROJEKTION"),
             "Makro-/Zoom-Layout ohne Zeitpfad"],
            [commands.includes("replyWithDocument") && commands.includes("deep-v171.png"),
             "unkomprimierte Telegram-PNG-Ausgabe"],
          ];
          for (const [ok, label] of checks) {
            if (!ok) {
              console.error(`Deep-Gate fehlgeschlagen: ${label}`);
              process.exit(1);
            }
          }
          NODE

      - name: "📤 Commit und Branch pushen"
        id: publish
        env:
          BRANCH: fix/v171-deep-decision-board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package.json package-lock.json \
            src/bot/commands.ts \
            src/core/forecast.ts src/core/deepChart.ts src/core/deepDecision.ts \
            src/core/deepChartRegression.ts \
            python_service/deep_drawer.py python_service/deep_render_smoke.py \
            dist

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "V171: turn deep chart into canonical decision board"
          git push --force-with-lease --set-upstream origin "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: "🔀 Pull Request erstellen oder aktualisieren"
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH: fix/v171-deep-decision-board
        run: |
          existing="$(gh pr list --base "$BASE_BRANCH" --head "$BRANCH" --state open --json url --jq '.[0].url')"
          if [ -n "$existing" ]; then
            echo "PR aktualisiert: $existing"
          else
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$BRANCH" \
              --title "V171: /deep als kanonisches Decision Board" \
              --body "$(cat <<'BODY'
          ## Ziel

          `/deep` wird von einer separaten Projektionsgrafik zu einer point-in-time-konsistenten Entscheidungstafel. Der Chart zeigt exakt die Level des Live-/Replay-Pfads oder eines bereits eingefrorenen Signal-Snapshots.

          ## Änderungen

          - gemeinsamer Forecast-Inspector für `/analyse`, Replay und `/deep`
          - Frozen PENDING-/CONFIRMED-Level haben Vorrang vor Neuberechnungen
          - keine künstlichen +12/−10-%-Ziele und kein schematischer Zeitpfad
          - Score-1-Einzellevel werden nicht mehr als handelbare Zonen dargestellt
          - Makrochart plus operativer 52–78-Bar-Setup-Zoom
          - bestätigte und vorläufige Pivots klar getrennt
          - Status, Schlusskurs-Trigger, Invalidierung, Modellziel und Potenzial-R
          - Zonenstärke als unabhängige Familien/Evidenzen
          - Count-Stabilität, Kontinuität, Qualitätsflags, C-Zeitfenster und Provenienz
          - Telegram-Ausgabe als unkomprimiertes 155-DPI-PNG-Dokument

          ## Pflicht-Gates

          - TypeScript-Build
          - V170 Point-in-Time-Regression
          - Scan12-Regression
          - V171 Deep-Level-Regression
          - Python-Kompilierung
          - Offline-Render-Smoke-Test mit PNG-Dimensionsprüfung
          - statische Deep-Integritätsregeln und `git diff --check`

          ## Prognoseintegrität

          V171 erzeugt keine neue Trefferwahrscheinlichkeit. Prognosewerte werden erst nach einem reproduzierbaren Walk-Forward-Backtest mit Stichprobengröße und Unsicherheitsintervall ergänzt.
          BODY
          )"
          fi

      - name: "📝 Zusammenfassung"
        run: |
          {
            echo "### ✅ V171 Deep Decision Board"
            echo "- /deep nutzt den kanonischen Forecast-Pfad oder einen Frozen Snapshot."
            echo "- Keine künstlichen Szenarioziele und keine scheinbare Zeitprognose."
            echo "- Makrostruktur + Setup-Zoom + eindeutige Schlusskursregeln."
            echo "- Unabhängige Familien, Evidenzen, Pivotstatus und Provenienz sichtbar."
            echo "- PNG wird in Telegram unkomprimiert als Dokument versendet."
            echo "- Build, Integritäts-, Scan12-, Deep- und Render-Gates bestanden."
          } >> "$GITHUB_STEP_SUMMARY"

