name: "🔧 Apply V168 (1-2-Suche /scan12)"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  v168:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "✍️ Dateien schreiben"
        run: |
          write() { mkdir -p "$(dirname "$1")"; echo "$2" | base64 -d > "$1"; echo "✓ $1"; }
          write "src/core/structureScan.ts" ""
          write "src/core/setupChart.ts" ""
          write "src/bot/commands.ts" ""
          write "src/index.ts" ""
          write "package.json" ""
          write "/tmp/pr_body.md" ""

      - name: "🟢 Node 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "🧪 Build + Referenzen + Struktur-Snapshots"
        run: |
          npm install
          npm run build
          npm run verify
          npm run snapshot

      - name: "🌿 Branch, Commit & Pull Request"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B feat/v168-scan12
          git add -A
          git commit -m "V168: /scan12 - 1-2-Suche ueber die Watchlist mit waehlbarer Aufloesung (1h/30m/1d/1wk); Range-Fallback in /setup fuer Yahoo-Luecken"
          git push -u origin feat/v168-scan12 --force
          gh pr create --base main --head feat/v168-scan12 \
            --title "V168: 1-2-Suche /scan12" \
            --body-file /tmp/pr_body.md \
            || echo "::warning::PR manuell: https://github.com/$GITHUB_REPOSITORY/compare/main...feat/v168-scan12"
          {
            echo "### ✅ V168 gebaut, geprueft & gepusht"
          } >> "$GITHUB_STEP_SUMMARY"
