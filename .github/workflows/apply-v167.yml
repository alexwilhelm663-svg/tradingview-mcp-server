name: "🔧 Apply V167 (Korrektur-Detail)"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  v167:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "✍️ Dateien schreiben"
        run: |
          write() { mkdir -p "$(dirname "$1")"; echo "$2" | base64 -d > "$1"; echo "✓ $1"; }
          write "src/core/correctionChart.ts" ""
          write "python_service/correction_drawer.py" ""
          write "src/bot/commands.ts" ""
          write "src/index.ts" ""
          write "package.json" ""
          write "/tmp/pr_body.md" ""

      - name: "🟢 Node 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "🧪 Build + Referenzen + Struktur-Snapshots"
        run: |
          npm install
          npm run build
          python3 -m py_compile python_service/correction_drawer.py
          npm run verify
          npm run snapshot

      - name: "🌿 Branch, Commit & Pull Request"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B feat/v167-korrektur-detail
          git add -A
          git commit -m "V167: Korrektur-Detail als zweites Bild bei /deep - Binnenzaehlung je Bein mit adaptiver Sub-Schwelle und vierteilige Reifepruefung gegen das titelspezifische Korrektur-Raster"
          git push -u origin feat/v167-korrektur-detail --force
          gh pr create --base main --head feat/v167-korrektur-detail \
            --title "V167: Korrektur-Detail" \
            --body-file /tmp/pr_body.md \
            || echo "::warning::PR manuell: https://github.com/$GITHUB_REPOSITORY/compare/main...feat/v167-korrektur-detail"
          {
            echo "### ✅ V167 gebaut, geprueft & gepusht"
          } >> "$GITHUB_STEP_SUMMARY"
