name: "🔧 Apply V157 (Unterstützungs-Screener)"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  v157:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "✍️ Dateien schreiben"
        run: |
          write() { mkdir -p "$(dirname "$1")"; echo "$2" | base64 -d > "$1"; echo "✓ $1"; }
          write "src/core/screener.ts" ""
          write "src/core/watchlist.ts" ""
          write "src/bot/commands.ts" ""
          write "src/index.ts" ""
          write "package.json" ""
          write "/tmp/pr_body.md" ""

      - name: "🟢 Node 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "🧪 Build + Referenzprüfung (Gate vor Commit)"
        run: |
          npm install
          npm run build
          npm run verify

      - name: "🌿 Branch, Commit & Pull Request"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B feat/v157-screener
          git add -A
          git commit -m "V157: taeglicher Unterstuetzungs-Screener (06:00 UTC) ueber 30 Titel - eine Telegram-Nachricht ohne Chart und ohne LLM, zwei Unterstuetzungsebenen je Titel, Kommando /screener"
          git push -u origin feat/v157-screener --force
          gh pr create --base main --head feat/v157-screener \
            --title "V157: taeglicher Unterstuetzungs-Screener" \
            --body-file /tmp/pr_body.md \
            || echo "::warning::PR manuell: https://github.com/$GITHUB_REPOSITORY/compare/main...feat/v157-screener"
          {
            echo "### ✅ V157 gebaut, geprueft & gepusht"
          } >> "$GITHUB_STEP_SUMMARY"
