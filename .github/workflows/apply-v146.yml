name: "🔧 Apply V146 (Proportionalitäts-Veto)"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  v146:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "✍️ Patch-Skript schreiben"
        run: |
          echo "" | base64 -d > /tmp/patch_v146.py
          echo "" | base64 -d > /tmp/pr_body.md

      - name: "🩹 Patch anwenden"
        run: python3 /tmp/patch_v146.py | tee /tmp/patch_log.txt

      - name: "🟢 Node 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "🧪 Build-Verifikation (Gate vor Commit)"
        run: |
          npm install
          npm run build

      - name: "🌿 Branch, Commit & Pull Request"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B fix/v146-proportionalitaet
          git add -A
          git commit -m "V146: Proportionalitaets-Veto - verwirft Zaehlungen mit degenerierter Welle 1, unverhaeltnismaessigen Wellendauern oder internem Gegenzug groesser als W2/W4 (Fall ARM); Enthaltung statt Fehlzaehlung"
          git push -u origin fix/v146-proportionalitaet --force
          gh pr create --base main --head fix/v146-proportionalitaet \
            --title "V146: Proportionalitaets-Veto" \
            --body-file /tmp/pr_body.md \
            || echo "::warning::PR manuell: https://github.com/$GITHUB_REPOSITORY/compare/main...fix/v146-proportionalitaet"
          {
            echo "### ✅ V146 gebaut & gepusht"
            echo ""
            echo '```'
            cat /tmp/patch_log.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
