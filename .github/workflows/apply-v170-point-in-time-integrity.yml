name: "🔒 Apply V170 (Point-in-Time Forecast Integrity)"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: apply-v170-point-in-time-integrity
  cancel-in-progress: false

jobs:
  v170:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🌿 Fix-Branch erstellen"
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$BASE_BRANCH"
          git checkout -B fix/v170-point-in-time-integrity "origin/$BASE_BRANCH"

      - name: "🧭 Erwartete Basis prüfen"
        shell: bash
        run: |
          node <<'NODE'
          const pkg = require("./package.json");
          if (!["169.0.0", "170.0.0"].includes(pkg.version)) {
            console.error(`V170 erwartet V169 als Basis; gefunden: ${pkg.version}`);
            process.exit(1);
          }
          NODE

      - name: "🩹 V170-Patch anwenden"
        shell: bash
        run: |
          patch_file="$(mktemp)"
          trap 'rm -f "$patch_file"' EXIT
          cat > "$patch_file" <<'V170_PATCH'
          diff --git a/package-lock.json b/package-lock.json
          index 94198ec..c2afc55 100644
