          +// Intraday-Zeitpunkte bleiben erhalten; der noch offene dritte Bar faellt weg.
          +const parsed = parseYahooCandles(yahoo, "1h", (t0 + 2.5 * 3600) * 1000);
          +assert.equal(parsed.candles.length, 2);
