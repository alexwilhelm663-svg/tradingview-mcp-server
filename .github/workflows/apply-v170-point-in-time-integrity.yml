          +import type { Candle } from "./marketData";
          +import { candleCloseTime } from "./marketData";
          +import { daysBetween, timeMs } from "./time";
          +import type { Direction } from "./forecast";
          +
          +export const PENDING_TIMEOUT_DAYS = 84;
          +export const TRADE_TIMEOUT_DAYS = 30;
          +
          +export interface FrozenSetup {
          +  direction: Direction;
          +  trigger: number;
          +  invalidation: number;
          +  cExtreme: number;
          +  createdAt: string;
          +  asOf: string;
          +  lastEvaluatedBar?: string | null;
          +}
          +
          +export type PendingDecision =
          +  | { type: "WAIT"; effectiveAt: string; reason: "STALE_BAR" | "PENDING" }
          +  | { type: "INVALIDATED"; effectiveAt: string }
          +  | { type: "TIMEOUT"; effectiveAt: string }
          +  | {
          +      type: "CONFIRMED" | "DEGENERATE";
          +      effectiveAt: string;
          +      entry: number;
          +      target: number;
          +      potentialR: number;
          +    };
          +
          +/** Eine einzige Zustandsregel fuer produktive Aufloesung und Replay. */
          +export function evaluatePendingBar(setup: FrozenSetup, bar: Candle): PendingDecision {
          +  const effectiveAt = candleCloseTime(bar);
          +  const lowerBound = setup.lastEvaluatedBar && timeMs(setup.lastEvaluatedBar) > timeMs(setup.asOf)
          +    ? setup.lastEvaluatedBar
          +    : setup.asOf;
          +  if (timeMs(effectiveAt) <= timeMs(lowerBound)) {
          +    return { type: "WAIT", effectiveAt, reason: "STALE_BAR" };
          +  }
          +
          +  const s2 = setup.direction === "LONG" ? 1 : -1;
          +  const invalidated = s2 * (bar.close - setup.invalidation) < 0;
          +  if (invalidated) return { type: "INVALIDATED", effectiveAt };
          +
          +  const triggered = s2 * (bar.close - setup.trigger) > 0;
          +  if (triggered) {
          +    const entry = bar.close;
          +    const target = setup.trigger + s2 * 1.618 * Math.abs(setup.trigger - setup.cExtreme);
          +    const risk = Math.abs(entry - setup.invalidation);
          +    const potentialR = risk > 0 ? (s2 * (target - entry)) / risk : -1;
          +    return {
          +      type: potentialR >= 0.25 ? "CONFIRMED" : "DEGENERATE",
          +      effectiveAt,
          +      entry,
          +      target,
          +      potentialR,
          +    };
          +  }
          +
          +  if (daysBetween(setup.createdAt, effectiveAt) >= PENDING_TIMEOUT_DAYS) {
          +    return { type: "TIMEOUT", effectiveAt };
          +  }
          +  return { type: "WAIT", effectiveAt, reason: "PENDING" };
          +}
          +
          +export interface FrozenTrade {
          +  direction: Direction;
          +  entry: number;
          +  invalidation: number;
          +  target: number;
          +  entryAt: string;
          +}
          +
          +export type TradeDecision =
          +  | { type: "WAIT"; effectiveAt: string }
          +  | {
          +      type: "TARGET" | "INVALIDATED" | "TIMEOUT";
          +      effectiveAt: string;
          +      exit: number;
          +      pnl: number;
          +      r: number;
          +    };
          +
          +/** Stop wird bei einer Same-Bar-Kollision konservativ vor dem Ziel geprueft. */
          +export function evaluateTradeBar(trade: FrozenTrade, bar: Candle): TradeDecision {
          +  const effectiveAt = candleCloseTime(bar);
          +  if (timeMs(effectiveAt) <= timeMs(trade.entryAt)) return { type: "WAIT", effectiveAt };
          +  const s2 = trade.direction === "LONG" ? 1 : -1;
          +  const risk = Math.abs(trade.entry - trade.invalidation);
          +  const result = (type: "TARGET" | "INVALIDATED" | "TIMEOUT", exit: number): TradeDecision => ({
          +    type,
          +    effectiveAt,
          +    exit,
          +    pnl: (s2 * (exit - trade.entry)) / trade.entry,
          +    r: risk > 0 ? (s2 * (exit - trade.entry)) / risk : 0,
          +  });
          +
          +  const stopHit = s2 === 1 ? bar.low <= trade.invalidation : bar.high >= trade.invalidation;
          +  if (stopHit) return result("INVALIDATED", trade.invalidation);
          +  const targetHit = s2 === 1 ? bar.high >= trade.target : bar.low <= trade.target;
          +  if (targetHit) return result("TARGET", trade.target);
          +  if (daysBetween(trade.entryAt, effectiveAt) >= TRADE_TIMEOUT_DAYS) {
          +    return result("TIMEOUT", bar.close);
          +  }
          +  return { type: "WAIT", effectiveAt };
          +}
          diff --git a/src/core/time.ts b/src/core/time.ts
          new file mode 100644
          index 0000000..3c8dc72
          --- /dev/null
          +++ b/src/core/time.ts
          @@ -0,0 +1,25 @@
          +const DAY_MS = 86_400_000;
          +
          +/** Akzeptiert kanonische ISO-Zeitpunkte und alte SQLite-/YYYY-MM-DD-Werte. */
          +export function timeMs(value: string): number {
          +  const normalized = value.includes("T")
          +    ? value
          +    : value.includes(" ")
          +      ? value.replace(" ", "T") + (/[zZ]|[+-]\d\d:\d\d$/.test(value) ? "" : "Z")
          +      : `${value}T00:00:00.000Z`;
          +  const ms = Date.parse(normalized);
          +  if (!Number.isFinite(ms)) throw new Error(`Ungueltiger Zeitpunkt: ${value}`);
          +  return ms;
          +}
          +
          +export function addDaysIso(value: string, days: number): string {
          +  return new Date(timeMs(value) + Math.round(days) * DAY_MS).toISOString();
          +}
          +
          +export function daysBetween(a: string, b: string): number {
          +  return (timeMs(b) - timeMs(a)) / DAY_MS;
          +}
          +
          +export function isoDate(value: string): string {
          +  return new Date(timeMs(value)).toISOString().slice(0, 10);
          +}
          
          V170_PATCH

          if git apply --check "$patch_file"; then
            git apply "$patch_file"
          elif git apply --reverse --check "$patch_file"; then
            echo "V170 ist bereits angewendet."
          else
            echo "::error::V170-Patch passt nicht auf den aktuellen Stand. Erwartete Basis: V169."
            exit 1
          fi

      - name: "🟢 Node 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: "🧪 Build und Regressions-Gates"
        run: |
          npm ci
          npm run build
          npm run verify:integrity
          npm run verify:scan12
          git diff --check

      - name: "🔍 Integritäts-Invarianten prüfen"
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const market = fs.readFileSync("src/core/marketData.ts", "utf8");
          const zigzag = fs.readFileSync("src/core/zigzag.ts", "utf8");
          const setups = fs.readFileSync("src/core/setups.ts", "utf8");
          const backtest = fs.readFileSync("src/backtest.ts", "utf8");

          const checks = [
            [!market.includes('.toISOString().split("T")[0]'), "keine Zeitstempel-Kürzung in marketData"],
            [zigzag.includes("includeProvisional = false"), "provisorische Pivots sind opt-in"],
            [setups.includes("signal_snapshots") && setups.includes("setup_events"), "immutable Snapshots + Events"],
            [backtest.includes("detectForecastSetup") && backtest.includes("evaluateTradeBar"), "gemeinsamer Live-/Replay-Pfad"],
          ];
          for (const [ok, label] of checks) {
            if (!ok) {
              console.error(`Integritäts-Gate fehlgeschlagen: ${label}`);
              process.exit(1);
            }
          }
          NODE

      - name: "📤 Commit und Branch pushen"
        id: publish
        env:
          BRANCH: fix/v170-point-in-time-integrity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             package.json package-lock.json             src/index.ts src/backtest.ts             src/core/marketData.ts src/core/time.ts src/core/zigzag.ts             src/core/impulseFinder.ts src/core/fibCluster.ts src/core/forecast.ts             src/core/lifecycle.ts src/core/db.ts src/core/setups.ts             src/core/outcome.ts src/core/engine.ts src/core/feedback.ts             src/core/completion.ts src/core/correction.ts src/core/confluence.ts             src/core/higherFrame.ts src/core/multiWave.ts             src/core/integrityRegression.ts

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "V170: enforce point-in-time forecast integrity"
          git push --force-with-lease --set-upstream origin "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: "🔀 Pull Request erstellen oder aktualisieren"
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH: fix/v170-point-in-time-integrity
        run: |
          existing="$(gh pr list --base "$BASE_BRANCH" --head "$BRANCH" --state open --json url --jq '.[0].url')"
          if [ -n "$existing" ]; then
            echo "PR aktualisiert: $existing"
          else
            gh pr create               --base "$BASE_BRANCH"               --head "$BRANCH"               --title "V170: Point-in-Time Forecast Integrity"               --body "$(cat <<'BODY'
          ## Ziel

          V170 beseitigt die wichtigsten Quellen von Look-ahead, Repaint und nicht reproduzierbaren Erfolgsquoten. Die Änderung optimiert keine Elliott-Parameter; sie stellt zuerst sicher, dass Live- und Replay-Ergebnisse denselben Informationsstand verwenden.

          ## Änderungen

          - volle UTC-Zeitstempel, explizite Bar-Schlusszeiten und Ausschluss offener Bars
          - Daten-Hash, Provider- und Adjustierungsstatus je Signal-Snapshot
          - bestätigte und provisorische ZigZag-Pivots getrennt; Signalpfade nutzen nur bestätigte Pivots
          - Cluster-Score zählt unabhängige Herleitungsfamilien statt korrelierter Ratio-Duplikate
          - unveränderliche signal_snapshots plus append-only setup_events
          - PENDING-Level werden nicht mehr überschrieben und ältere Bars können neue Setups nicht bestätigen
          - identische reine Setup-/Lifecycle-Funktionen in Live und Walk-Forward-Replay
          - Weekly-Trigger, Daily-Ziel/Stop und einheitliche Horizonte (84d/30d)
          - Timeouts sind kein künstliches binäres Gewinn-/Verlust-Label
          - Feedback-Statistik berücksichtigt nur tatsächlich aufgelöste binäre Outcomes
          - Breakout-Signale werden über einen stabilen Signal-Key dedupliziert

          ## Pflicht-Gates

          - npm run build
          - npm run verify:integrity
          - npm run verify:scan12
          - statische Point-in-Time-Invarianten
          - git diff --check

          ## Erwartete Wirkung

          Historische Trefferquoten können zunächst sinken. Das ist beabsichtigt: V170 entfernt optimistische Informationslecks und schafft erst damit eine belastbare Basis für spätere Kalibrierung, Holdouts und probabilistische Prognosen.
          BODY
          )"
          fi

      - name: "📝 Zusammenfassung"
        run: |
          {
            echo "### ✅ V170 Point-in-Time Forecast Integrity"
            echo "- Nur abgeschlossene Bars und bestätigte Pivots im Signalpfad."
            echo "- Immutable Signal-Snapshots und append-only Zustandsereignisse."
            echo "- Unabhängige Konfluenzfamilien statt Pseudo-Score."
            echo "- Live und Replay teilen Detektor, Pending- und Trade-Lifecycle."
            echo "- Build, V170-Regression und Scan12-Regression sind Pflicht-Gates."
          } >> "$GITHUB_STEP_SUMMARY"

