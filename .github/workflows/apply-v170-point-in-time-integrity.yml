          +++ b/package-lock.json
          @@ -1,12 +1,12 @@
           {
             "name": "ew-quant-hunter",
          -  "version": "169.0.0",
          +  "version": "170.0.0",
             "lockfileVersion": 3,
             "requires": true,
             "packages": {
               "": {
                 "name": "ew-quant-hunter",
          -      "version": "169.0.0",
          +      "version": "170.0.0",
                 "dependencies": {
                   "better-sqlite3": "^11.0.0",
                   "dotenv": "^16.4.5",
          diff --git a/package.json b/package.json
          index ebe35ed..2858fc4 100644
          --- a/package.json
          +++ b/package.json
          @@ -1,6 +1,6 @@
           {
             "name": "ew-quant-hunter",
          -  "version": "169.0.0",
          +  "version": "170.0.0",
             "description": "Elliott Wave Trading Bot (konsolidierter Composition Root)",
             "main": "dist/index.js",
             "scripts": {
          @@ -10,7 +10,8 @@
               "verify": "node dist/verify.js",
               "report": "node dist/report.js",
               "snapshot": "node dist/snapshot.js",
          -    "verify:scan12": "node dist/core/scan12Regression.js"
          +    "verify:scan12": "node dist/core/scan12Regression.js",
          +    "verify:integrity": "node dist/core/integrityRegression.js"
             },
             "dependencies": {
               "better-sqlite3": "^11.0.0",
          diff --git a/src/backtest.ts b/src/backtest.ts
          index 149861f..47e459d 100644
          --- a/src/backtest.ts
