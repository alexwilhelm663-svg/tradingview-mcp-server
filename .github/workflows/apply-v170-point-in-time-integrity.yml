          +
          +const t0 = 1_700_000_000;
          +const yahoo = {
          +  timestamp: [t0, t0 + 3600, t0 + 7200],
          +  indicators: {
          +    quote: [{
          +      open: [100, 101, 102],
          +      high: [102, 103, 104],
          +      low: [99, 100, 101],
          +      close: [101, 102, 103],
