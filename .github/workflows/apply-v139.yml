name: "🔧 Apply V139 (beidseitige 1-2-Zählung)"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  v139:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "✍️ Patch-Skript schreiben"
        run: |
          echo "" | base64 -d > /tmp/patch_v139.py
          echo "" | base64 -d > /tmp/pr_body.md
          echo "✓ Skript geschrieben"

      - name: "🩹 Patch anwenden (bricht ab, wenn Muster fehlen)"
        run: python3 /tmp/patch_v139.py

      - name: "🟢 Node 20"
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: "🧪 Build-Verifikation (Gate vor Commit)"
        run: |
          npm install
          npm run build

      - name: "🌿 Branch, Commit & Pull Request"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B feat/v139-beidseitige-zaehlung
          git add -A
          git commit -m "V139: 1-2-Zaehlung in beide Richtungen (Korrekturrichtung ab W5 + Gegenrichtung ab Korrektur-Extrem); Report entdoppelt (Umschlag- und Strukturnotiz nur noch im Big Picture)"
          git push -u origin feat/v139-beidseitige-zaehlung --force
          gh pr create --base main --head feat/v139-beidseitige-zaehlung \
            --title "V139: beidseitige 1-2-Zaehlung, Report entdoppelt" \
            --body-file /tmp/pr_body.md \
            || echo "::warning::PR manuell: https://github.com/$GITHUB_REPOSITORY/compare/main...feat/v139-beidseitige-zaehlung"
          {
            echo "### ✅ V139 gebaut & gepusht"
          } >> "$GITHUB_STEP_SUMMARY"
