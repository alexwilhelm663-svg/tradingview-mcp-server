name: "🔧 Apply V150 (Zyklen im Chart)"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  v150:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "✍️ Dateien schreiben"
        run: |
          write() { mkdir -p "$(dirname "$1")"; echo "$2" | base64 -d > "$1"; echo "✓ $1"; }
          write "src/core/cycles.ts" ""
          write "src/core/chart.ts" ""
          write "src/core/engine.ts" ""
          write "src/core/impulseFinder.ts" ""
          write "src/core/proportion.ts" ""
          write "python_service/drawer.py" ""
          write "knowledge/rules/elliott_rules.md" ""
          write "src/index.ts" ""
          write "package.json" ""
          write "/tmp/pr_body.md" ""

      - name: "🟢 Node 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "🧪 Build-Verifikation (Gate vor Commit)"
        run: |
          npm install
          npm run build
          python3 -m py_compile python_service/drawer.py

      - name: "🌿 Branch, Commit & Pull Request"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B feat/v150-zyklen-chart
          git add -A
          git commit -m "V150: Zyklus-Skelett und Binnenstruktur im Chart; enthaelt V147 (Proportionalitaet kalibriert + Walk-down), V148 (Zyklen-Sicht) und V149 (Binnenstruktur)"
          git push -u origin feat/v150-zyklen-chart --force
          gh pr create --base main --head feat/v150-zyklen-chart \
            --title "V150: Zyklen im Chart (+ V147-V149)" \
            --body-file /tmp/pr_body.md \
            || echo "::warning::PR manuell: https://github.com/$GITHUB_REPOSITORY/compare/main...feat/v150-zyklen-chart"
          {
            echo "### ✅ V150 gebaut & gepusht"
          } >> "$GITHUB_STEP_SUMMARY"
